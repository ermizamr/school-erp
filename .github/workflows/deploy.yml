name: CI / Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same branch / PR
concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Preview — runs on every pull_request targeting main
  # ────────────────────────────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # vercel deploy (no --prebuilt) uploads the source to Vercel and lets
      # Vercel run the build on its own infra. No local build step needed,
      # no .vercel/output/ path confusion.
      - name: Deploy preview
        id: deploy
        run: |
          URL=$(vercel deploy \
            --yes \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
        working-directory: web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const body = [
              '## 🚀 Vercel Preview Deployment',
              '',
              '| | |',
              '|---|---|',
              `| **Preview URL** | ${url} |`,
              `| **Commit** | \`${{ github.sha }}\` |`,
              `| **Branch** | \`${{ github.head_ref }}\` |`,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ────────────────────────────────────────────────────────────────────────────
  # Production — runs only on push to main
  # ────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy production
        run: |
          vercel deploy \
            --yes \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
